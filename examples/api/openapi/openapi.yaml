openapi: 3.1.0
info:
  title: Demo Products API
  version: 1.0.0
  description: Sample OpenAPI used by Ticidocs Phase 3.
servers:
  - url: https://api.example.com
    description: Production
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
  schemas:
    Product:
      type: object
      required: [id, name, price]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Notebook
        price:
          type: number
          format: double
          example: 19.99
        category:
          $ref: "#/components/schemas/Category"
    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
    Error:
      type: object
      properties:
        message:
          type: string
security:
  - bearerAuth: []
  - apiKey: []
paths:
  /products:
    get:
      operationId: listProducts
      summary: List products
      description: Returns a paginated list of products.
      tags: [Products]
      parameters:
        - name: limit
          in: query
          description: Max items to return
          schema:
            type: integer
            default: 20
            example: 20
        - name: cursor
          in: query
          description: Pagination cursor
          schema:
            type: string
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
              example:
                - id: 1
                  name: Notebook
                  price: 19.99
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createProduct
      summary: Create product
      description: Creates a new product.
      tags: [Products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Product"
            example:
              name: Notebook
              price: 19.99
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Validation error
  /products/{id}:
    get:
      operationId: getProduct
      summary: Get product
      tags: [Products]
      parameters:
        - name: id
          in: path
          required: true
          description: Product id
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
    delete:
      operationId: deleteProduct
      summary: Delete product
      tags: [Products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
