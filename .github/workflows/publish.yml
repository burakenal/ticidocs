name: Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (no npm publish)"
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build --filter=./packages/* --filter=create-ticidocs

      - name: Publish (dry run)
        if: ${{ inputs.dry_run }}
        run: |
          pnpm --filter "./packages/*" publish --access public --dry-run --no-git-checks
          pnpm --filter create-ticidocs publish --access public --dry-run --no-git-checks

      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm --filter "./packages/*" publish --access public --no-git-checks
          pnpm --filter create-ticidocs publish --access public --no-git-checks
